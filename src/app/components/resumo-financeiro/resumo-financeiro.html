<div class="grid gap-4 sm:grid-cols-3">

  <!-- Receitas -->
  <div class="group rounded-2xl border border-slate-200/70 bg-white/80 p-5 shadow-lg shadow-emerald-500/5 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-emerald-500/10">

    <div class="flex items-center justify-between">

      <div>
        <p class="text-sm font-medium text-slate-500">
          Receitas
        </p>

        <p class="mt-2 text-2xl font-bold tracking-tight text-slate-900">
          R$ {{ (receitas$ | async)?.toFixed(2) }}
        </p>
      </div>

      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-emerald-50 text-emerald-600 transition-transform duration-300 group-hover:scale-110">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M5 10l7-7 7 7M12 3v18"
          />
        </svg>

      </div>

    </div>

  </div>


  <!-- Despesas -->
  <div class="group rounded-2xl border border-slate-200/70 bg-white/80 p-5 shadow-lg shadow-rose-500/5 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-rose-500/10">

    <div class="flex items-center justify-between">

      <div>
        <p class="text-sm font-medium text-slate-500">
          Despesas
        </p>

        <p class="mt-2 text-2xl font-bold tracking-tight text-slate-900">
          R$ {{ (despesas$ | async)?.toFixed(2) }}
        </p>
      </div>

      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-rose-50 text-rose-600 transition-transform duration-300 group-hover:scale-110">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M19 14l-7 7-7-7M12 21V3"
          />
        </svg>

      </div>

    </div>

  </div>


  <!-- Saldo -->
  <div class="group rounded-2xl border border-indigo-100 bg-gradient-to-br from-white to-indigo-50/60 p-5 shadow-lg shadow-indigo-500/10 backdrop-blur-md transition-all duration-300 hover:-translate-y-1 hover:shadow-xl hover:shadow-indigo-500/15">

    <div class="flex items-center justify-between">

      <div>
        <p class="text-sm font-medium text-slate-500">
          Saldo
        </p>

        <p class="mt-2 text-2xl font-bold tracking-tight text-indigo-700">
          R$ {{ (saldo$ | async)?.toFixed(2) }}
        </p>
      </div>

      <div class="flex h-11 w-11 items-center justify-center rounded-xl bg-indigo-100 text-indigo-600 transition-transform duration-300 group-hover:scale-110">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 8c-2.21 0-4 1.343-4 3s1.79 3 4 3 4 1.343 4 3-1.79 3-4 3m0-12V5m0 14v-3"
          />
        </svg>

      </div>

    </div>

  </div>

</div>
