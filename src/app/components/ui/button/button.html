<button
  [type]="type"
  [disabled]="disabled"
  class="inline-flex items-center justify-center gap-2 rounded-xl px-5 py-3 text-sm font-semibold transition-all duration-300 ease-out focus:outline-none focus:ring-4 disabled:cursor-not-allowed disabled:opacity-50"
  [class.w-full]="fullWidth"

  [class.bg-gradient-to-r]="variant === 'primary'"
  [class.from-indigo-600]="variant === 'primary'"
  [class.to-violet-600]="variant === 'primary'"
  [class.text-white]="variant === 'primary'"
  [class.shadow-lg]="variant === 'primary'"
  [class.shadow-indigo-500/20]="variant === 'primary'"
  [class.hover:-translate-y-0.5]="variant === 'primary'"
  [class.hover:shadow-xl]="variant === 'primary'"
  [class.hover:shadow-indigo-500/30]="variant === 'primary'"
  [class.focus:ring-indigo-500/20]="variant === 'primary'"

  [class.border]="variant !== 'primary'"
  [class.border-slate-200]="variant === 'secondary'"
  [class.bg-white]="variant === 'secondary'"
  [class.text-slate-600]="variant === 'secondary'"
  [class.hover:bg-slate-50]="variant === 'secondary'"
  [class.focus:ring-slate-500/10]="variant === 'secondary'"

  [class.border-rose-200]="variant === 'danger'"
  [class.bg-rose-50]="variant === 'danger'"
  [class.text-rose-600]="variant === 'danger'"
  [class.hover:bg-rose-100]="variant === 'danger'"
  [class.focus:ring-rose-500/10]="variant === 'danger'"
  (click)="handleClick()"
>

  <ng-content></ng-content>
</button>
